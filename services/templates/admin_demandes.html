<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />

    <title>إدارة الطلبات</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-light">
    <nav class="navbar navbar-dark bg-dark shadow">
      <div class="container">
        <span class="navbar-brand"> 📂 إدارة الطلبات </span>

        <div>
          <a href="/api/dashboard-page/" class="btn btn-light btn-sm">
            📊 Dashboard
          </a>
        </div>
      </div>
    </nav>

    <div class="container mt-4">
      <div class="card shadow">
        <div class="card-body">
          <h3 class="mb-4">📋 قائمة الطلبات</h3>

          <div class="table-responsive">
            <table class="table table-bordered table-hover">
              <thead class="table-dark">
                <tr>
                  <th>#</th>
                  <th>الاسم</th>
                  <th>ب-ت-و</th>
                  <th>الهاتف</th>
                  <th>العنوان</th>
                  <th>الخدمة</th>
                  <th>الحالة</th>
                  <th>الوثائق</th>
                  <th>الإجراءات</th>
                </tr>
              </thead>

              <tbody id="tableBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <script>
      let token = localStorage.getItem("token");

      if (!token) {
        window.location.href = "/api/login-page/";
      }

      fetch("/api/demandes/", {
        headers: {
          Authorization: "Bearer " + token,
        },
      })
        .then((res) => res.json())

        .then((data) => {
          let rows = "";

          data.forEach((d) => {
            rows += `

        <tr>

            <td>${d.id}</td>

            <td>${d.nom} ${d.prenom}</td>
            <td>${d.cin} </td>
            <td>${d.telephone}</td>
            <td>${d.adresse}</td>
            <td>${d.type_service}</td>

            <td>

                <span class="badge bg-warning">
                    ${d.statut}
                </span>

            </td>

           <td>

    ${
      d.copie_cin
        ? `<a href="${d.copie_cin}" target="_blank" class="btn btn-sm btn-primary mb-1">
              📄 CIN
           </a>`
        : `<span class="text-muted">لا يوجد CIN</span>`
    }

    <br>

    ${
      d.plan_situation
        ? `<a href="${d.plan_situation}" target="_blank" class="btn btn-sm btn-info mb-1">
              🗺 Plan
           </a>`
        : `<span class="text-muted">لا يوجد Plan</span>`
    }

    <br>

    ${
      d.plan_architacturel
        ? `<a href="${d.plan_architacturel}" target="_blank" class="btn btn-sm btn-secondary">
              🏠 Plan Arch
           </a>`
        : `<span class="text-muted">لا يوجد Plan Arch</span>`
    }
    <br>
    ${
      d.certificat_propriete
        ? `<a href="${d.certificat_propriete}" target="_blank" class="btn btn-sm btn-secondary">
              🏠 Certificat
           </a>`
        : `<span class="text-muted">لا يوجد Certificat</span>`
    }
    <br>
    ${
      d.certificat_exonération
        ? `<a href="${d.certificat_exoneration}" target="_blank" class="btn btn-sm btn-secondary">
              🏠 Exonération
           </a>`
        : `<span class="text-muted">لا يوجد Exonération</span>`
    }

</td>

            <td>

                <button class="btn btn-success btn-sm"
                        onclick="updateStatut(${d.id}, 'acceptee')">

                    ✔ قبول

                </button>

                <button class="btn btn-danger btn-sm"
                        onclick="updateStatut(${d.id}, 'refusee')">

                    ✖ رفض

                </button>

            </td>

        </tr>

        `;
          });

          document.getElementById("tableBody").innerHTML = rows;
        });

      function updateStatut(id, statut) {
        fetch(`/api/demandes/${id}/statut/`, {
          method: "PUT",

          headers: {
            "Content-Type": "application/json",
            Authorization: "Bearer " + token,
          },

          body: JSON.stringify({
            statut: statut,
          }),
        })
          .then((res) => res.json())

          .then((data) => {
            alert("✅ تم التحديث");

            location.reload();
          });
      }
    </script>
  </body>
</html>
