<!DOCTYPE html>
<html lang="ar">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>{% block title %}Baladia{% endblock %}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<style>

body{
    font-family: Arial, sans-serif;
}

.card{
    border-radius: 15px;
}

table{
    background: white;
}

</style>

<body class="bg-light">

<!-- 🔷 Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand" href="#">🏛️ Baladia</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">

            <ul class="navbar-nav me-auto text-center">

                <li class="nav-item">
                    <a class="nav-link" href="/api/form/">📝 تقديم طلب</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/api/mes-demandes/">🔍 طلباتي</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/api/dashboard-page/">📊 Dashboard</a>
                </li>

            </ul>

            <button class="btn btn-danger" onclick="logout()">🚪 Logout</button>

        </div>
    </div>
</nav>

<!-- 🔥 Content -->
<div class="container mt-4">
    {% block content %}
    {% endblock %}
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>

// 🔐 حماية الصفحات
let token = localStorage.getItem('token');

if (!token){
    window.location.href = "/api/login-page/";
}

// 🚪 Logout
function logout(){
    localStorage.removeItem('token');
    window.location.href = "/api/login-page/";
}

</script>

</body>
</html>
