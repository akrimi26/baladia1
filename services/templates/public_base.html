<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}Baladia{% endblock %}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        *{
            font-family: 'Cairo', sans-serif;
        }

        body{
            background: #f1f5f9;
            margin: 0;
        }

        .hero{

            background: linear-gradient(135deg,#2563eb,#0ea5e9);

            color: white;

            padding: 70px 20px;

            text-align: center;

            border-radius: 0 0 35px 35px;

            margin-bottom: 40px;

            box-shadow: 0 5px 20px rgba(0,0,0,0.15);

        }

        .hero h1{

            font-size: 42px;

            font-weight: bold;

        }

        .hero p{

            font-size: 20px;

            opacity: 0.95;

        }

        .form-card{

            background: white;

            padding: 40px;

            border-radius: 25px;

            box-shadow: 0 10px 30px rgba(0,0,0,0.08);

        }

        .form-control{

            border-radius: 15px;

            height: 55px;

            font-size: 18px;

        }

        textarea.form-control{
            height: auto;
        }

        label{

            font-size: 18px;

            margin-bottom: 10px;

            font-weight: 600;

        }

        .btn-primary{

            height: 55px;

            border-radius: 15px;

            font-size: 20px;

            font-weight: bold;

        }

        footer{

            text-align: center;

            padding: 30px;

            color: gray;

            margin-top: 50px;

        }

        @media(max-width:768px){

            .hero h1{
                font-size: 30px;
            }

            .hero p{
                font-size: 18px;
            }

            .form-card{
                padding: 25px;
            }

        }

    </style>

</head>

<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">

    <div class="container">

        <a class="navbar-brand fw-bold" href="/api/form/">
            🏛️ بلدية بئر الحفي 
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="/api/form/">
                        📝 تقديم طلب
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/api/suivi-page/">
                        🔎 متابعة الطلب
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/api/login-page/">
                        🔐 إدارة البلدية
                    </a>
                </li>

            </ul>

        </div>

    </div>

</nav>


<div class="hero">

    <h1>🏛️ بلدية بئر الحفي </h1>

    <p>
        تقديم مطالب الماء والكهرباء بطريقة سهلة وسريعة
    </p>

</div>

<div class="container">

    {% block content %}
    {% endblock %}

</div>

<footer>

    © 2026 جميع الحقوق محفوظة

</footer>

</body>
</html>
