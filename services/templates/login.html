<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>تسجيل الدخول</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body{

            background: linear-gradient(135deg,#0d6efd,#0a58ca);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            font-family:Tahoma;

        }

        .login-card{

            width:100%;
            max-width:420px;

            background:white;

            border-radius:25px;

            padding:40px;

            box-shadow:0 10px 30px rgba(0,0,0,0.2);

            animation:fadeIn 0.8s ease;

        }

        .logo{

            font-size:70px;
            text-align:center;
            margin-bottom:10px;

        }

        .title{

            text-align:center;
            font-weight:bold;
            font-size:32px;
            margin-bottom:5px;
            color:#0d6efd;

        }

        .subtitle{

            text-align:center;
            color:gray;
            margin-bottom:30px;

        }

        .form-control{

            height:50px;
            border-radius:12px;

        }

        .btn-login{

            background:#0d6efd;
            color:white;
            border:none;

            height:50px;

            border-radius:12px;

            font-size:18px;
            font-weight:bold;

            transition:0.3s;

        }

        .btn-login:hover{

            background:#0b5ed7;
            transform:scale(1.02);

        }

        .input-group-text{

            border-radius:12px 0 0 12px;

        }

        @keyframes fadeIn{

            from{

                opacity:0;
                transform:translateY(20px);

            }

            to{

                opacity:1;
                transform:translateY(0);

            }

        }

    </style>

</head>

<body>

<div class="login-card">

    <div class="logo">
        🏛
    </div>

    <div class="title">
        إدارة البلدية
    </div>

    <div class="subtitle">
        تسجيل الدخول للإدارة
    </div>

    <form id="loginForm">

        <div class="mb-3">

            <label class="mb-2">اسم المستخدم</label>

            <div class="input-group">

                <span class="input-group-text">
                    <i class="bi bi-person"></i>
                </span>

                <input type="text"
                       id="username"
                       class="form-control"
                       placeholder="أدخل اسم المستخدم"
                       required>

            </div>

        </div>

        <div class="mb-4">

            <label class="mb-2">كلمة المرور</label>

            <div class="input-group">

                <span class="input-group-text">
                    <i class="bi bi-lock"></i>
                </span>

                <input type="password"
                       id="password"
                       class="form-control"
                       placeholder="أدخل كلمة المرور"
                       required>

            </div>

        </div>

        <button class="btn btn-login w-100">

            <i class="bi bi-box-arrow-in-right"></i>

            تسجيل الدخول

        </button>

    </form>

</div>

<script>

document.getElementById('loginForm').addEventListener('submit', function(e){

    e.preventDefault();

    fetch('/api/login/', {

        method:'POST',

        headers:{
            'Content-Type':'application/json'
        },

        body: JSON.stringify({

            username:document.getElementById('username').value,
            password:document.getElementById('password').value

        })

    })

    .then(res => res.json())

    .then(data => {

        if(data.access){

            localStorage.setItem('token', data.access);

            window.location.href = "/api/dashboard-page/";

        }else{

            alert("❌ اسم المستخدم أو كلمة المرور غير صحيحة");

        }

    })

})

</script>

</body>

</html>
